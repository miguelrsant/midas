name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: midas
          POSTGRES_PASSWORD: midas
          POSTGRES_DB: midas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U midas -d midas"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        ports: ["1025:1025", "8025:8025"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Banco de teste
        run: PGPASSWORD=midas psql -h localhost -U midas -d midas -c "CREATE DATABASE midas_test OWNER midas;"

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # No CI o Postgres e o Mailpit vêm dos services acima, não do docker compose.
      - run: pnpm exec vitest run

      - name: Auditoria de dependências (produção)
        run: pnpm audit --prod --audit-level high

      - name: Migrações e build (valores de .env.development)
        run: |
          set -a; . ./.env.development; set +a
          pnpm prisma migrate deploy
          pnpm build

      - name: Testes de ponta a ponta
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
